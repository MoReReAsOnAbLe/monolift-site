<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — Monolift</title>
<link rel="icon" href="/favicon.png">
<style>
  :root{ --bg:#F0E7D2; --surface:#FFFFFF; --text:#1a1a1a; --muted:#6b6b6b;
    --border:rgba(0,0,0,0.10); --accent:#0FB5C6; --accent-dark:#0A8E9C;
    --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
    --font-serif:ui-serif,"New York","Iowan Old Style",Georgia,serif; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0A0A0A; --surface:#161616; --text:#F4EFE3; --muted:#9a9a9a; --border:rgba(255,255,255,0.12); } }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:24px}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
    border-radius:20px;padding:40px 32px;box-shadow:0 20px 50px rgba(0,0,0,0.12);text-align:center}
  .check{font-size:52px;line-height:1;margin-bottom:10px}
  h1{font-family:var(--font-serif);font-size:26px;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 24px;font-size:15px;line-height:1.5}
  a.appbtn{display:inline-block;padding:14px 26px;border-radius:12px;background:var(--accent);
    color:#00323a;font-weight:700;text-decoration:none}
  a.appbtn:hover{background:var(--accent-dark);color:#fff}
</style>
</head>
<body>
  <div class="card">
    <div class="check">🎉</div>
    <h1>Email confirmed</h1>
    <p>Your Monolift account is verified. Head back to the app to start logging.</p>
    <a class="appbtn" href="worknotes://">Open Monolift</a>
  </div>
</body>
</html>
